<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Amir Seyed Rezaei</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: radial-gradient(circle, #252525, #080808 70%);
    color: white;
    font-family: 'Vazirmatn', sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 30px 18px;
}

.container {
    width: 100%;
    max-width: 420px;
    text-align: center;
}

/* تصویر پروفایل */

.photo {
    width: 190px;
    height: 190px;

    margin: 0 auto -60px;
    position: relative;
    z-index: 2;

    border-radius: 50%;
    padding: 5px;

    background: linear-gradient(135deg, white, #555);

    box-shadow: 0 0 40px #ffffff20;
}

.photo img {
    width: 100%;
    height: 100%;

    border-radius: 50%;
    border: 4px solid #111;

    object-fit: cover;
}

/* کادر اصلی */

.card {
    background: linear-gradient(145deg, #191919, #0b0b0b);

    border: 1px solid #333;
    border-radius: 30px;

    padding: 85px 24px 25px;

    box-shadow: 0 20px 60px #0009;

    animation: appear 1s ease;
}

.badge {
    display: inline-block;

    border: 1px solid #444;
    border-radius: 30px;

    padding: 7px 15px;

    font-size: 12px;
    color: #ccc;

    margin-bottom: 18px;
}

h1 {
    font-size: 23px;
    font-weight: 800;

    direction: ltr;

    margin-bottom: 8px;
}

.subtitle {
    font-size: 12px;
    color: #888;

    direction: ltr;
}

.line {
    width: 50px;
    height: 2px;

    background: white;
    border-radius: 5px;

    margin: 23px auto;
}

.description {
    font-size: 13px;
    line-height: 2.2;

    color: #bbb;

    margin-bottom: 25px;
}

/* دکمه های شبکه اجتماعی */

.social {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.social a {
    display: flex;
    align-items: center;
    gap: 14px;

    padding: 17px 18px;

    background: #1b1b1b;
    border: 1px solid #333;

    border-radius: 17px;

    color: white;
    text-decoration: none;

    transition: 0.3s;
}

.social a:hover {
    background: #292929;
    transform: translateY(-4px);
    border-color: #777;
}

.social i:first-child {
    font-size: 27px;
}

.social span {
    flex: 1;
    text-align: right;
    direction: ltr;
    font-weight: bold;
}

.instagram i:first-child {
    color: #e7a4b7;
}

.telegram i:first-child {
    color: #70c9f3;
}

.arrow {
    font-size: 13px;
    color: #777;
}

.footer {
    border-top: 1px solid #333;

    margin-top: 28px;
    padding-top: 18px;

    display: flex;
    justify-content: space-between;

    font-size: 10px;
    color: #777;

    direction: ltr;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (max-width: 380px) {
    h1 {
        font-size: 19px;
    }

    .photo {
        width: 165px;
        height: 165px;
    }

    .card {
        padding: 80px 18px 22px;
    }
}

</style>
</head>

<body>

<div class="container">

    <!-- تصویر شخصی -->

    <div class="photo">
        <img
        src="profile.jpg"
        alt="Amir Seyed Rezaei">
    </div>

    <!-- اطلاعات شخصی -->

    <main class="card">

        <div class="badge">
            وب‌سایت شخصی من
        </div>

        <h1>Amir Seyed Rezaei</h1>

        <p class="subtitle">
            Welcome to my personal space
        </p>

        <div class="line"></div>

        <p class="description">
            به صفحه شخصی من خوش آمدید.
            <br>
            از طریق شبکه‌های اجتماعی زیر
            می‌توانید با من در ارتباط باشید.
        </p>

        <div class="social">

            <!-- Instagram -->

            <a href="https://www.instagram.com/amirseyedrezaei/"
               target="_blank"
               rel="noopener noreferrer">

                <i class="fa-brands fa-instagram"></i>

                <span>Instagram</span>

                <i class="fa-solid fa-arrow-up-left-from-square arrow"></i>

            </a>

            <!-- Telegram -->

            <a href="tg://resolve?domain=Amir_S_Rezaei"
               onclick="setTimeout(function(){
                   window.location.href='https://t.me/Amir_S_Rezaei';
               },1000);">

                <i class="fa-brands fa-telegram"></i>

                <span>Telegram</span>

                <i class="fa-solid fa-arrow-up-left-from-square arrow"></i>

            </a>

        </div>

        <div class="footer">

            <span>PERSONAL WEBSITE</span>

            <span>
                © <script>
                    document.write(new Date().getFullYear());
                </script>
            </span>

        </div>

    </main>

</div>

</body>
</html>
